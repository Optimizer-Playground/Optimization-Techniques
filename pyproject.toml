[project]
name = "Optimizer-Playground"
version = "0.1.0.dev18"
description = """
A curated collection of interesting and novel ideas in query optimization for relational database systems, implemented using the PostBOUND framework.
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lazy-loader>=0.4",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "postbound==0.22.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "tables>=3.11.1",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "jupyterlab>=4.5.6",
    "plotnine>=0.15.7",
    "pre-commit>=4.4",
    "pytest>=9.0.2",
    "ruff==0.16.6",
    "ty==0.0.78",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["postbound_extensions*"]

[tool.ty.src]
exclude = ["postbound_extensions/fastgres/**", "postbound_extensions/ceb/**"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["postbound_extensions/fastgres/**"]

[tool.ruff.lint.flake8-bugbear]
# These factories all return immutable value objects, so sharing one instance across all calls
# (which is what a default argument does) is safe and intentional.
extend-immutable-calls = [
    "postbound_extensions.safebound._catalog.SafeBoundSpec.default",
    "postbound_extensions.mscn._estimator.MscnHyperParams.default",
    "postbound.Cardinality.unknown"
]
