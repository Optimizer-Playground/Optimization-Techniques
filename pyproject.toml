[project]
name = "Optimizer-Playground"
version = "0.1.0.dev15"
description = """
A curated collection of interesting and novel ideas in query optimization for relational database systems, implemented using the PostBOUND framework.
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lazy-loader>=0.4",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "postbound>=0.21.5",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "tables>=3.11.1",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "jupyterlab>=4.5.6",
    "plotnine>=0.15.7",
    "pytest>=9.0.2",
    "quacklab>=1.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["postbound_extensions*"]

[tool.uv.sources]
postbound = { git = "https://github.com/Optimizer-Playground/PostBOUND", rev = "cc5da4b47ff2d25928f5146afde5918c138225e9" }

[tool.ty.src]
exclude = ["postbound_extensions/fastgres/**", "postbound_extensions/ceb/**"]
